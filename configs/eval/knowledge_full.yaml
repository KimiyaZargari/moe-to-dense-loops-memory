# configs/knowledge_full.yaml
#
# Knowledge benchmark suite — full test sets.
# Run with:
#   python run_eval.py --config configs/knowledge_full.yaml
#
# Tasks
# ─────
# 1. TriviaQA (closed-book): rc.nocontext split, 5-shot, exact_match.
#    Primary knowledge probe: no passage is given, so the model must recall facts.
#
# 2. ARC-Easy: 25-shot (as in Kim et al.), acc + acc_norm.
#
# 3. MMLU (mmlu_continuation): 5-shot (as in Kim et al.), acc + acc_norm.
#    We use mmlu_continuation instead of mmlu because the default mmlu group
#    template restricts metric_list to acc only; mmlu_continuation has no
#    metric_list restriction so both acc and acc_norm are computed for every
#    leaf task (= every subject).  The 57 per-subject results appear in
#    results.json under keys like mmlu_abstract_algebra_continuation.
#
# NOTE: run_eval.py detects that these tasks have different num_fewshot values
# and uses its per-task fewshot path (TaskManager + lm_eval.evaluate directly).

# ── Model ─────────────────────────────────────────────────────────────────────
model: ibm-granite/granite-3.1-1b-a400m-base
dtype: float16
max_length: 4096

# ── Hardware ──────────────────────────────────────────────────────────────────
device: mps             # options: cpu | mps | cuda | auto

# ── Tasks ─────────────────────────────────────────────────────────────────────
tasks:
  - name: triviaqa
    num_fewshot: 5
  - name: arc_easy
    num_fewshot: 25
  - name: mmlu_continuation
    num_fewshot: 5

# ── Run settings ──────────────────────────────────────────────────────────────
batch_size: 4
# limit: null — run full test sets
seed: 0
log_samples: true

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: results
run_name: granite_knowledge_full

# configs/knowledge_quick.yaml
#
# Knowledge benchmark suite — small limits for a fast smoke-test.
# Run with:
#   python run_eval.py --config configs/knowledge_quick.yaml
#
# IMPORTANT: metrics from limited runs are NOT comparable to published results.
# Use knowledge_full.yaml for final numbers.
#
# limit behaviour
# ───────────────
# lm_eval applies `limit` independently to every leaf task.  For group tasks
# this means it applies per subject, not to the group total.
# For mmlu_continuation (57 subjects × limit examples each):
#   limit=10  →  570 examples total
#   limit=50  →  2 850 examples total
# This is intentional and documented here so the per-subject sample size is
# always the same across subjects, keeping subject-level comparisons valid.

# ── Model ─────────────────────────────────────────────────────────────────────
model: ibm-granite/granite-3.1-1b-a400m-base
dtype: float16
max_length: 4096

# ── Hardware ──────────────────────────────────────────────────────────────────
device: mps             # options: cpu | mps | cuda | auto

# ── Tasks ─────────────────────────────────────────────────────────────────────
tasks:
  - name: triviaqa
    num_fewshot: 5
  - name: arc_easy
    num_fewshot: 25
  - name: mmlu_continuation
    num_fewshot: 5

# ── Run settings ──────────────────────────────────────────────────────────────
batch_size: 4
limit: 10               # 10 examples per leaf task (= 10 per MMLU subject)
seed: 0
log_samples: true

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: results
run_name: granite_knowledge_quick

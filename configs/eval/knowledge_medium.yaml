# configs/knowledge_medium.yaml
#
# Knowledge benchmark — balanced sample sizes for meaningful per-task scores
# without running full test sets.
#
#   TriviaQA   500 examples  (vs 11 313 full)
#   ARC-Easy   500 examples  (vs  2 376 full)
#   MMLU       10 per subject × 58 subjects = 580 examples  (vs 5 800 full)
#
# Run with:
#   python run_eval.py --config configs/knowledge_medium.yaml
#
# NOTE: metrics are still based on subsets — NOT comparable to published results.
# Use knowledge_full.yaml for final numbers.

# ── Model ─────────────────────────────────────────────────────────────────────
model: ibm-granite/granite-3.1-1b-a400m-base
dtype: float16
max_length: 4096

# ── Hardware ──────────────────────────────────────────────────────────────────
device: mps

# ── Tasks (per-task limits override the global limit) ─────────────────────────
tasks:
  - name: triviaqa
    num_fewshot: 5
    limit: 200
  - name: arc_easy
    num_fewshot: 25
    limit: 200
  - name: mmlu_continuation
    num_fewshot: 5
    limit: 10        # applied per subject → 10 × 58 = 580 total

# ── Run settings ──────────────────────────────────────────────────────────────
batch_size: 4
seed: 0
log_samples: true

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: results
run_name: granite_knowledge_medium

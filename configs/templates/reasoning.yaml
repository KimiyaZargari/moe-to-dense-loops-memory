# Template: reasoning benchmarks (committed). Generate a runnable config with:
#   python scripts/make_config.py reasoning --size quick --name baseline_reasoning_quick

model: ibm-granite/granite-3.1-1b-a400m-base
dtype: float16
max_length: 4096
device: auto            # cpu | mps | cuda | auto

tasks:
  - name: gsm8k
    num_fewshot: 5
  - name: hellaswag
    num_fewshot: 10
  - name: winogrande
    num_fewshot: 5

batch_size: 4
seed: 0
log_samples: true
output_dir: results

# Consumed by make_config.py (not written to the generated config).
# null = full test set.
sizes:
  quick: 20
  # medium: std. error = sqrt(p(1-p)/n); 95% CI is about 2x that. Tasks set to null run in full.
  #   gsm8k: n=1000 of 1319 -> SE ~1.3pp at ~22% acc (generative, so capped for cost)
  #   hellaswag: n=1000 of 10042 -> SE ~1.5pp at ~60% acc_norm
  #   winogrande: full 1267 -> SE ~1.4pp at ~60% acc
  medium: {gsm8k: null, hellaswag: 1000, winogrande: null}
  full: null

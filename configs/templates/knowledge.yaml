# Template: knowledge benchmarks (committed). Generate a runnable config with:
#   python scripts/make_config.py knowledge --size quick --name baseline_knowledge_quick
#
# `limit` is applied per leaf task by lm_eval, so for mmlu_continuation it is
# per subject (57 subjects x limit examples). A size can be a single number
# (global limit) or a {task: limit} map (per-task limits).

model: ibm-granite/granite-3.1-1b-a400m-base
dtype: float16
max_length: 4096
device: auto            # cpu | mps | cuda | auto

tasks:
  - name: triviaqa
    num_fewshot: 5
  - name: arc_easy
    num_fewshot: 25
  - name: mmlu_continuation
    num_fewshot: 5

batch_size: 4
seed: 0
log_samples: true
output_dir: results

# Consumed by make_config.py (not written to the generated config).
# null = full test set.
sizes:
  quick: 10
  # medium: std. error = sqrt(p(1-p)/n); 95% CI is about 2x that.
  #   triviaqa, arc_easy: n=1000 -> SE ~1.6pp at 50% acc (CI ~ +/-3pp)
  #   mmlu_continuation: per subject, 30 x 57 subjects = ~1710 examples
  #     -> SE ~1.1pp at ~30% acc (CI ~ +/-2pp)
  medium: {triviaqa: 1000, arc_easy: 1000, mmlu_continuation: 30}
  full: null
